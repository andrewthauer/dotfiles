# see https://jj-vcs.github.io/jj/latest/config/ "$schema" = "https://jj-vcs.github.io/jj/latest/config-schema.json"

[user]
name = "Andrew Thauer"
email = "6507159+andrewthauer@users.noreply.github.com"

# [core]
# fsmonitor = "watchman"

# [core.watchman]
# register-snapshot-trigger = true

[ui]
default-command = "log"
diff-formatter = ["difft", "--color=always", "--width", "$width", "$left", "$right"]
# graph.style = "ascii"

[git]
# push-new-bookmarks = true
private-commits = "description(glob:'wip:*') | description(glob:'private:*')"
write-change-id-header = true

# Configured in ~/.config/jj/conf.d/local.toml
# [git]
# sign-on-push = true
# [signing]
# backend = "ssh"
# key = "<public key>
# backends.ssh.program = "/Applications/1Password.app/Contents/MacOS/op-ssh-sign"
# sign-all = true

[remotes.origin]
auto-track-bookmarks = "glob:andrewthauer/*"

#
# revsets
#

[revsets]
# Default jj log view, minus other workspaces' working copies that are
# currently empty (no changes yet). Breakdown:
#   present(@) | ancestors(immutable_heads().., 2) | trunk()
#     -> this is jj's normal default: your @, recent ancestors of the
#        immutable heads, and trunk().
#   ~ (stale_workspace_wcs() & empty())
#     -> subtract any *other* workspace's @ that has no content, so idle
#        agent/feature workspaces don't clutter the log. Your own @ is
#        untouched even when empty.
# log = '(present(@) | ancestors(immutable_heads().., 2) | trunk()) ~ (stale_workspace_wcs() & empty())'

# Target for `jj bookmark advance`: move the nearest bookmark to the
# *parent* of @ instead of @ itself — useful if @ is usually an empty/
# in-progress commit and you only want the bookmark to follow finished work.
bookmark-advance-to = '@-'

#
# revset-aliases
#

[revset-aliases]
# branch name helpers
integration = 'description("[integration]") | description("[integration merge]")'
wip = 'description(regex:"^\\[(wip|WIP|todo|TODO)\\]|(wip|WIP|todo|TODO):?")'
testing = '(description(regex:"^testing:"))'

# Keep Graphite's internal tracking refs in the immutable set so they don't
# show up as visible heads in `jj log`.
"immutable_heads()" = "present(trunk()) | tags() | untracked_remote_bookmarks()"

# bookmark helpers
all_bookmarks = 'all:(bookmarks() ~ immutable())'
'closest_bookmark(to)' = 'heads(::to & bookmarks())'

# All workspaces' working-copy commits except the one you're currently in.
# ("working_copies()" = every workspace's @; "~ @" drops your own so it's
# never affected by the filter below, no matter which workspace you run from.)
'stale_workspace_wcs()' = 'working_copies() ~ @'

# misc
'recent()' = 'committer_date(after:"3 months ago")'
'direct_descendants(x)' = 'descendants(x, 2) ~ (x | main)'


#
# aliases
#

[aliases]
fetch = ["git", "fetch"]
lazy = ["util", "exec", "--", "lazyjj"]
logc = ["log", "-T", "builtin_log_compact"]
logd = ["log", "-T", "builtin_log_detailed"]
logr = ["log", "-r", "recent()"]
pr = ["util", "exec", "--", "jj-pr"]
push = ["git", "push"]
sync = ["rebase", "--source", "all:roots(trunk()..@)", "--destination", "trunk()"]
tug = ["bookmark", "advance"]
ui = ["util", "exec", "--", "jjui"]

#
# template-aliases
#

[template-aliases]
'format_short_signature(signature)' = 'signature.email().local()'
'format_timestamp(timestamp)' = 'timestamp.ago()'
'commit_timestamp(commit)' = 'commit.author().timestamp()'
log_oneline = '''
  if(root,
    format_root_commit(self),
    label(if(current_working_copy, "working_copy"),
      concat(
        separate(" ",
          format_short_change_id_with_hidden_and_divergent_info(self),
          if(empty, label("empty", "(empty)")),
          if(description,
            description.first_line(),
            label(if(empty, "empty"), description_placeholder),
          ),
          author.email().local(),
          bookmarks,
          tags,
          working_copies,
          if(git_head, label("git_head", "HEAD")),
          if(conflict, label("conflict", "conflict")),
          if(config("ui.show-cryptographic-signatures").as_boolean(),
            format_short_cryptographic_signature(signature)),
        ) ++ "\n",
      ),
    )
  )
'''
